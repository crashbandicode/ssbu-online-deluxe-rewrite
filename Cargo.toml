[package]
name = "ssbu-online-deluxe-rewrite"
version = "0.8.1"
edition = "2021"
publish = false
build = "build.rs"

[package.metadata.skyline]
titleid = "01006A800016E000"

[lib]
# cdylib only: Cargo skips LTO for a library that is also an rlib. The
# integration test includes `src/plugin_api.rs` by path instead.
crate-type = ["cdylib"]

[features]
default = []
# Coverage variant (tools/Build.ps1 -Coverage): the runtime writes LLVM raw
# profiles of this crate to the card. Built with -C instrument-coverage through
# tools/coverage/config.toml; never part of the product NRO.
coverage = []

[dependencies]
# Plugin registration ABI shared with separately built NROs (sdk/abi).
deluxe-plugin-abi = { path = "sdk/abi" }

[target.'cfg(target_os = "switch")'.dependencies]
skyline = "=0.6.0"

[dev-dependencies]
# Host-side end-to-end test: the public SDK registering through the exact
# C table shape the NRO exports (tests/plugin_sdk_roundtrip.rs).
deluxe-plugin-sdk = { path = "sdk/sdk" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
# "s" since 0.3.5: .text 1590896 -> 1399936 B (-12%) with no .bss change; "z"
# would save another 93 KB but trims loop codegen in hooked paths. These
# numbers, and fat LTO measuring identical to thin, date from when the rlib
# crate type kept LTO off.
opt-level = "s"
debug = 2
strip = false
lto = "thin"
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("switch"))'] }
