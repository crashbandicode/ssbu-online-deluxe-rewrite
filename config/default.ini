# Default: FX changes apply only in online modes.
version=1
effects=on
effects_scope=online
input_buffer=auto
# Menu supports live vanilla / lesslag / llultra; core experiments require restart.
render_mode=vanilla
# Saved preference only; Stealth network behavior is currently unavailable.
stealth=false
# Read-only peer diagnostics; leave disabled for normal use.
peer_observer=false
