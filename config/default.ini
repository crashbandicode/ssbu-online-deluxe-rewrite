# Character FX settings live in sd:/ultimate/ssbu_fx_control/config.ini since 0.5.0.
version=1
input_buffer=auto
# Saved manual profile. Auto uses the scene and does not overwrite this.
render_mode=vanilla
vanilla_plus=true
# Dim chord hint line under the Settings and Window Options tables (0.6.0). The Window Options page's Hints row toggles it.
hints=true
auto_profile=true
platform=console
# Default on. An explicit false is kept. Suppresses the beacon and profile payload.
stealth=true
# Legacy key, ignored since 0.5.4; peer diagnostics were removed.
peer_observer=false
# Display privacy. Default off. Hides remote name, interface, settings, and ping.
streamer=false
# Legacy key, ignored since 0.5.4; the FPS-boost experiment was removed.
fps_boost=false
