# Default: FX changes apply only in online modes.
version=1
effects=on
effects_scope=online
input_buffer=auto
# Saved manual profile. Auto uses the scene and does not overwrite this.
render_mode=vanilla
auto_profile=true
platform=console
# Default on. An explicit false is kept. Suppresses the beacon and profile payload.
stealth=true
# Read-only peer diagnostics; leave disabled for normal use.
peer_observer=false
# Display privacy. Default off. Hides remote name, interface, settings, and ping.
streamer=false
