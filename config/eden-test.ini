# Offline + online test override. Copy with the matching new NRO while Eden is closed.
# effects=reduced is valid. This file stays on so offline tests start from full visuals.
version=1
effects=on
effects_scope=all
input_buffer=auto
render_mode=vanilla
auto_profile=true
platform=emulator
# Default on. An explicit false is kept. Suppresses the beacon and profile payload.
stealth=true
streamer=false
# Emulator-only native-window swap interval. Default off.
fps_boost=false
peer_observer=false
