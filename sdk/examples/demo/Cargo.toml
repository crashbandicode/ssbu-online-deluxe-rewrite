[package]
name = "deluxe-plugin-demo"
version = "0.1.0"
edition = "2021"
publish = false
description = "Minimal separate-NRO consumer of the Online Deluxe plugin API"

[package.metadata.skyline]
titleid = "01006A800016E000"

[lib]
crate-type = ["cdylib"]

[dependencies]
deluxe-plugin-sdk = { path = "../../sdk" }

[target.'cfg(target_os = "switch")'.dependencies]
skyline = "=0.6.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
debug = 2
strip = false
lto = "thin"
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("switch"))'] }
