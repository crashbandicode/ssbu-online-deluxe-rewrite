<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="759" height="459" rx="16" fill="#1b1c20" stroke="#3a3c42"/>
  <text x="28" y="39" fill="#ffffff" font-size="18">Why LLUltra can miss a refresh</text>
  <text x="28" y="63" fill="#9aa0a6" font-size="13">Illustrative timing, not a measured trace. Dashed lines are display refreshes.</text>

  <g fill="#9aa0a6" font-size="12" text-anchor="middle">
    <text x="196" y="88">refresh</text>
    <text x="462" y="88">refresh</text>
    <text x="728" y="88">refresh</text>
  </g>
  <g stroke="#6b6f78" stroke-dasharray="4 4">
    <line x1="196" y1="94" x2="196" y2="396"/>
    <line x1="462" y1="94" x2="462" y2="396"/>
    <line x1="728" y1="94" x2="728" y2="396"/>
  </g>

  <g fill="#ffffff" font-size="15" font-weight="600">
    <text x="28" y="140">LessLag</text>
    <text x="28" y="229">LLUltra,</text>
    <text x="28" y="247">light frame</text>
    <text x="28" y="329">LLUltra,</text>
    <text x="28" y="347">heavy frame</text>
  </g>

  <!-- LessLag: the GPU draws frame A while the CPU updates frame B -->
  <rect x="204" y="106" width="226" height="26" rx="6" fill="#6f9bd1"/>
  <text x="317" y="124" fill="#0f1a2b" font-size="13" text-anchor="middle">Update frame B</text>
  <rect x="204" y="138" width="18" height="26" rx="5" fill="#d9a441"/>
  <text x="213" y="156" fill="#0f1a2b" font-size="12" text-anchor="middle">P</text>
  <rect x="226" y="138" width="190" height="26" rx="6" fill="#2f8f6f"/>
  <text x="321" y="156" fill="#ffffff" font-size="13" text-anchor="middle">Draw frame A</text>
  <circle cx="462" cy="180" r="5" fill="#2f8f6f"/>
  <text x="472" y="184" fill="#c9ccd2" font-size="13">A appears</text>
  <circle cx="728" cy="180" r="5" fill="none" stroke="#2f8f6f" stroke-width="1.5"/>
  <text x="718" y="184" fill="#c9ccd2" font-size="13" text-anchor="end">B appears</text>
  <g fill="#9aa0a6" font-size="13">
    <text x="476" y="124">Each gets a whole refresh,</text>
    <text x="476" y="156">working on different frames.</text>
  </g>

  <!-- LLUltra, light frame: CPU then GPU on frame B inside one refresh -->
  <rect x="204" y="206" width="146" height="26" rx="6" fill="#6f9bd1"/>
  <text x="277" y="224" fill="#0f1a2b" font-size="13" text-anchor="middle">Update frame B</text>
  <rect x="354" y="238" width="18" height="26" rx="5" fill="#d9a441"/>
  <text x="363" y="256" fill="#0f1a2b" font-size="12" text-anchor="middle">P</text>
  <rect x="376" y="238" width="78" height="26" rx="6" fill="#2f8f6f"/>
  <text x="415" y="256" fill="#ffffff" font-size="13" text-anchor="middle">Draw B</text>
  <circle cx="462" cy="280" r="5" fill="#2f8f6f"/>
  <text x="472" y="284" fill="#c9ccd2" font-size="13">B appears</text>
  <g fill="#9aa0a6" font-size="13">
    <text x="476" y="224">CPU and GPU share one refresh.</text>
    <text x="476" y="256">B appears a refresh sooner.</text>
  </g>

  <!-- LLUltra, heavy frame: the GPU runs past the refresh -->
  <rect x="204" y="306" width="190" height="26" rx="6" fill="#6f9bd1"/>
  <text x="299" y="324" fill="#0f1a2b" font-size="13" text-anchor="middle">Update frame B (heavy)</text>
  <rect x="398" y="338" width="18" height="26" rx="5" fill="#d9a441"/>
  <text x="407" y="356" fill="#0f1a2b" font-size="12" text-anchor="middle">P</text>
  <rect x="420" y="338" width="100" height="26" rx="6" fill="#2f8f6f"/>
  <text x="470" y="356" fill="#ffffff" font-size="13" text-anchor="middle">Draw B</text>
  <text x="532" y="356" fill="#9aa0a6" font-size="13">runs past the refresh</text>
  <rect x="524" y="306" width="196" height="26" rx="6" fill="#3a3c42"/>
  <text x="622" y="324" fill="#9aa0a6" font-size="13" text-anchor="middle">Next frame waits</text>
  <circle cx="462" cy="380" r="5" fill="#c0564f"/>
  <text x="472" y="384" fill="#e0a09a" font-size="13">missed</text>
  <circle cx="728" cy="380" r="5" fill="#2f8f6f"/>
  <text x="718" y="384" fill="#c9ccd2" font-size="13" text-anchor="end">B appears</text>

  <text x="28" y="418" fill="#c9ccd2" font-size="14">Frame B took two refreshes. The frame rate drops and B's latency gain is gone.</text>
  <text x="28" y="442" fill="#9aa0a6" font-size="13">Blue: CPU. Green: GPU. P: presentation request. Dots: the display shows the frame.</text>
</svg>
