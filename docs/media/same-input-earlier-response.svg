<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">The same button press becomes visible earlier</title>
  <desc id="desc">Schematic comparison, not a timing scale or measured trace. All profiles receive the same press and spend the same illustrated CPU time updating frame N. A longer pipeline holds back its graphics work or image longer. LessLag shortens that path; LLUltra can shorten it further when deadlines are met. Other CPU updates overlap GPU drawing. Queuing N and displaying N are separate events. The measured Eden frame counts are reported separately.</desc>
  <rect x="0.5" y="0.5" width="759" height="649" rx="16" fill="#1b1c20" stroke="#3a3c42"/>
  <text x="28" y="39" fill="#ffffff" font-size="18">The same input, reflected on screen sooner</text>
  <text x="28" y="63" fill="#9aa0a6" font-size="13">Schematic, not a timing scale or a measured trace. N is the picture carrying this press.</text>
  <text x="28" y="91" fill="#ffffff" font-size="13">Same button press</text>
  <path d="M196 86H720 M714 82L720 86L714 90" stroke="#9aa0a6" fill="none"/>
  <text x="710" y="104" fill="#9aa0a6" font-size="11" text-anchor="end">time moves right</text>
  <path d="M196 86V538" stroke="#c9ccd2" stroke-dasharray="4 4"/>
  <circle cx="196" cy="86" r="5" fill="#ffffff"/>
  <g fill="#ffffff" font-size="16" font-weight="600">
    <text x="28" y="139">Vanilla</text><text x="28" y="299">LessLag</text><text x="28" y="459">LLUltra</text>
  </g>
  <g fill="#9aa0a6" font-size="13">
    <text x="28" y="160">longer pipeline</text><text x="28" y="320">shorter path</text><text x="28" y="480">when it fits</text>
  </g>
  <!-- Identical input-related CPU work; later CPU updates continue in parallel. -->
  <g fill="#6f9bd1">
    <rect x="204" y="112" width="100" height="28" rx="6"/>
    <rect x="204" y="272" width="100" height="28" rx="6"/>
    <rect x="204" y="432" width="100" height="28" rx="6"/>
  </g>
  <g fill="#6f9bd1" opacity="0.25">
    <rect x="324" y="112" width="386" height="28" rx="6"/>
    <rect x="324" y="272" width="386" height="28" rx="6"/>
    <rect x="324" y="432" width="386" height="28" rx="6"/>
  </g>
  <g fill="#0f1a2b" font-size="13" text-anchor="middle">
    <text x="254" y="131">CPU · N</text><text x="254" y="291">CPU · N</text><text x="254" y="451">CPU · N</text>
  </g>
  <g fill="#c9ccd2" font-size="12" text-anchor="middle">
    <text x="517" y="131">other CPU updates continue</text>
    <text x="517" y="291">other CPU updates continue</text>
    <text x="517" y="451">other CPU updates continue</text>
  </g>
  <!-- Grey spans compress the rest of the pipeline, not a particular wait. -->
  <g fill="#3a3c42">
    <rect x="304" y="150" width="253" height="28" rx="6"/>
    <rect x="304" y="310" width="123" height="28" rx="6"/>
  </g>
  <g fill="#c9ccd2" font-size="12" text-anchor="middle">
    <text x="430" y="169">work / buffering ahead</text><text x="365" y="329">less pipeline delay</text>
  </g>
  <g fill="#2f8f6f" stroke="#ffffff" stroke-width="1.5">
    <rect x="565" y="150" width="85" height="28" rx="6"/>
    <rect x="435" y="310" width="85" height="28" rx="6"/>
    <rect x="304" y="470" width="85" height="28" rx="6"/>
  </g>
  <g fill="#ffffff" font-size="13" text-anchor="middle">
    <text x="607" y="169">GPU · N</text><text x="477" y="329">GPU · N</text><text x="346" y="489">GPU · N</text>
  </g>
  <!-- Presentation requests can precede completion; visibility comes later. -->
  <g stroke="#6b6f78" stroke-dasharray="3 4">
    <path d="M675 189H720V211 M435 349H585V371 M304 509H450V531" fill="none"/>
  </g>
  <g fill="#d9a441"><circle cx="675" cy="189" r="5"/><circle cx="435" cy="349" r="5"/><circle cx="304" cy="509" r="5"/></g>
  <g fill="#f3e2bd" font-size="12">
    <text x="665" y="193" text-anchor="end">P · queue N</text><text x="425" y="353" text-anchor="end">P · queue N</text><text x="294" y="513" text-anchor="end">P · queue N</text>
  </g>
  <g fill="#2f8f6f"><circle cx="720" cy="211" r="6"/><circle cx="585" cy="371" r="6"/><circle cx="450" cy="531" r="6"/></g>
  <g fill="#ffffff" font-size="13">
    <text x="710" y="235" text-anchor="end">N visible: your input's response</text>
    <text x="575" y="395" text-anchor="end">N visible sooner</text>
    <text x="440" y="555" text-anchor="end">N visible sooner still</text>
  </g>
  <text x="28" y="584" fill="#c9ccd2" font-size="13">The input-related CPU work is the same size in every row. The path to display is shorter.</text>
  <g fill="#9aa0a6" font-size="12">
    <text x="28" y="606">Grey spans summarize pipeline delay, not a measured CPU or GPU idle period.</text>
    <text x="28" y="624">P queues an image. Green dots are later eligible refreshes after GPU completion.</text>
    <text x="28" y="642">Positions are schematic. Use the separate Eden comparison for measured response counts.</text>
  </g>
</svg>
