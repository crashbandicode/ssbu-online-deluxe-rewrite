<svg xmlns="http://www.w3.org/2000/svg" width="760" height="534" viewBox="0 0 760 534" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="759" height="533" rx="16" fill="#1b1c20" stroke="#3a3c42"/>
  <text x="28" y="39" fill="#ffffff" font-size="18">Fewer active images, then an earlier schedule</text>
  <text x="28" y="65" fill="#9aa0a6" font-size="13">Capacity and policy only, not frame ages or exact hardware timing.</text>

  <g fill="#ffffff" font-size="18" font-weight="600">
    <text x="28" y="104">Vanilla · three active buffers</text>
    <text x="28" y="254">LessLag · two active buffers</text>
    <text x="28" y="404">LLUltra · two active buffers</text>
  </g>
  <g fill="#33455b">
    <rect x="28" y="122" width="224" height="62" rx="10"/>
    <rect x="268" y="122" width="224" height="62" rx="10"/>
    <rect x="508" y="122" width="224" height="62" rx="10"/>
  </g>
  <g fill="#214a40">
    <rect x="28" y="272" width="224" height="62" rx="10"/>
    <rect x="268" y="272" width="224" height="62" rx="10"/>
  </g>
  <g fill="#4a3a28">
    <rect x="28" y="422" width="224" height="62" rx="10"/>
    <rect x="268" y="422" width="224" height="62" rx="10"/>
  </g>
  <g fill="none" stroke="#6b6f78" stroke-dasharray="4 4">
    <rect x="508" y="272" width="224" height="62" rx="10"/>
    <rect x="508" y="422" width="224" height="62" rx="10"/>
  </g>

  <g fill="#ffffff" font-size="16" text-anchor="middle">
    <text x="140" y="148">Buffer A</text>
    <text x="380" y="148">Buffer B</text>
    <text x="620" y="148">Buffer C</text>
    <text x="140" y="298">Buffer A</text>
    <text x="380" y="298">Buffer B</text>
    <text x="140" y="448">Buffer A</text>
    <text x="380" y="448">Buffer B</text>
  </g>
  <g fill="#c9ccd2" font-size="14" text-anchor="middle">
    <text x="140" y="173">Active image</text>
    <text x="380" y="173">Active image</text>
    <text x="620" y="173">Active image</text>
    <text x="140" y="323">Active image</text>
    <text x="380" y="323">Active image</text>
    <text x="140" y="473">Active image</text>
    <text x="380" y="473">Active image</text>
