  <g fill="#9aa0a6" font-size="14" text-anchor="middle">
    <text x="620" y="308">Not active</text>
    <text x="620" y="458">Not active</text>
  </g>
  <g fill="#c9ccd2" font-size="14">
    <text x="28" y="209">+2 index · TwoBehind · more room for rendering work in flight</text>
    <text x="28" y="359">+1 index · OneBehind · a shorter buffered path</text>
    <text x="28" y="509">+0 index · Immediate · earlier flush, tighter timing</text>
  </g>
