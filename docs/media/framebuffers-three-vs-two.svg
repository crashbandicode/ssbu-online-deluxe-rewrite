<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Reusable image buffers in all three profiles</title>
  <desc id="desc">Vanilla uses three active image buffers; LessLag and LLUltra each use two. Illustrative frame contents show greater circulation capacity with three buffers. Buffers are reusable memory, not fixed frame numbers or a separate presentation queue. Two buffers still allow presentation requests.</desc>
  <rect x="0.5" y="0.5" width="759" height="429" rx="16" fill="#1b1c20" stroke="#3a3c42"/>
  <text x="28" y="39" fill="#ffffff" font-size="18">Space for frames in circulation</text>
  <text x="28" y="63" fill="#9aa0a6" font-size="13">Illustrative contents, not a measured snapshot. The same buffers are reused every frame.</text>
  <g fill="#26272c">
    <rect x="20" y="82" width="720" height="74" rx="12"/>
    <rect x="20" y="168" width="720" height="74" rx="12"/>
    <rect x="20" y="254" width="720" height="74" rx="12"/>
  </g>
  <g fill="#ffffff" font-size="16" font-weight="600">
    <text x="32" y="113">Vanilla</text><text x="32" y="199">LessLag</text><text x="32" y="285">LLUltra</text>
  </g>
  <g fill="#9aa0a6" font-size="13">
    <text x="32" y="136">3 buffers</text><text x="32" y="222">2 buffers</text><text x="32" y="308">2 buffers</text>
  </g>
  <g fill="#33455b">
    <rect x="176" y="94" width="172" height="50" rx="8"/>
    <rect x="362" y="94" width="172" height="50" rx="8"/>
    <rect x="548" y="94" width="172" height="50" rx="8"/>
  </g>
  <g fill="#214a40">
    <rect x="176" y="180" width="172" height="50" rx="8"/>
    <rect x="362" y="180" width="172" height="50" rx="8"/>
    <rect x="176" y="266" width="172" height="50" rx="8"/>
    <rect x="362" y="266" width="172" height="50" rx="8"/>
  </g>
  <g fill="none" stroke="#6b6f78" stroke-dasharray="4 4">
    <rect x="548" y="180" width="172" height="50" rx="8"/>
    <rect x="548" y="266" width="172" height="50" rx="8"/>
  </g>
  <g fill="#ffffff" font-size="14">
    <text x="190" y="114">Buffer A</text><text x="376" y="114">Buffer B</text><text x="562" y="114">Buffer C</text>
    <text x="190" y="200">Buffer A</text><text x="376" y="200">Buffer B</text>
    <text x="190" y="286">Buffer A</text><text x="376" y="286">Buffer B</text>
  </g>
  <g fill="#c9ccd2" font-size="12">
    <text x="190" y="133">10 · on screen</text><text x="376" y="133">11 · queued, ready</text><text x="562" y="133">12 · drawing</text>
    <text x="190" y="219">10 · on screen</text><text x="376" y="219">11 · drawing</text>
    <text x="190" y="305">10 · on screen</text><text x="376" y="305">11 · drawing</text>
  </g>
  <g fill="#9aa0a6" font-size="13" text-anchor="middle">
    <text x="634" y="210">No third active buffer</text><text x="634" y="296">No third active buffer</text>
  </g>
  <g fill="#c9ccd2" font-size="13">
    <text x="28" y="356">A buffer is image memory. A frame is its changing contents, such as picture 10 or 11.</text>
    <text x="28" y="378">The presentation queue tracks requests for these images; it is not an extra buffer.</text>
  </g>
  <text x="28" y="408" fill="#9aa0a6" font-size="13">Two buffers still use a presentation queue. Buffer count alone does not predict latency.</text>
</svg>
