<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="759" height="299" rx="16" fill="#1b1c20" stroke="#3a3c42" stroke-width="1"/>
  <text x="28" y="39" fill="#ffffff" font-size="18">Simplified timing illustration</text>

  <g fill="#9aa0a6" font-size="14" text-anchor="middle">
    <text x="178" y="78">0 ms</text>
    <text x="444" y="78">16.7 ms</text>
    <text x="710" y="78">33.3 ms</text>
  </g>
  <g stroke="#6b6f78" stroke-width="1" stroke-dasharray="4 4">
    <line x1="178" y1="92" x2="178" y2="220"/>
    <line x1="444" y1="92" x2="444" y2="220"/>
    <line x1="710" y1="92" x2="710" y2="220"/>
  </g>
  <g fill="#ffffff" font-size="15">
    <text x="28" y="130">Late present</text>
    <text x="28" y="190">Early present</text>
  </g>

  <rect x="178" y="108" width="218" height="34" rx="6" fill="#6f9bd1"/>
  <rect x="396" y="108" width="64" height="34" rx="6" fill="#d9a441"/>
  <rect x="460" y="108" width="250" height="34" rx="6" fill="#2b2d33"/>
  <g font-size="14" text-anchor="middle">
    <text x="287" y="130" fill="#0f1a2b">CPU work</text>
    <text x="428" y="130" fill="#0f1a2b">Present</text>
    <text x="585" y="130" fill="#c9ccd2">Wait</text>
  </g>

  <rect x="178" y="168" width="28" height="34" rx="6" fill="#2f8f6f"/>
  <rect x="206" y="168" width="218" height="34" rx="6" fill="#6f9bd1"/>
  <rect x="424" y="168" width="20" height="34" rx="6" fill="#2b2d33"/>
  <g font-size="14" text-anchor="middle">
    <text x="192" y="190" fill="#ffffff">P</text>
    <text x="315" y="190" fill="#0f1a2b">CPU work</text>
  </g>
  <text x="710" y="259" fill="#9aa0a6" font-size="14" text-anchor="end">Frame deadline missed above</text>
</svg>
