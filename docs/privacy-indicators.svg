<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1040" height="840" viewBox="0 0 1040 840"
     font-family="DejaVu Sans, Verdana, sans-serif">
  <title>Deluxe privacy indicators: source-geometry preview (not a screenshot)</title>
  <desc>Enlarged redraw of privacy_icons() in src/runtime/ui.rs. Coordinates are
    in units of the ImGui font size, the same normalized values the source passes
    to point(x, y). Colours: GREEN rgb(0.45,0.90,0.45), GREY rgb(0.70,0.70,0.70),
    YELLOW rgb(0.95,0.85,0.25); the theme text colour is shown as white.</desc>
  <defs>
    <!-- Stealth OFF: two quadratic Beziers and a filled pupil. -->
    <g id="eye-open" fill="none" stroke="currentColor" stroke-width="0.085">
      <path d="M0.05 0.5 Q0.5 0.02 0.95 0.5"/>
      <path d="M0.05 0.5 Q0.5 0.98 0.95 0.5"/>
      <circle cx="0.5" cy="0.5" r="0.13" fill="currentColor" stroke="none"/>
    </g>
    <!-- Stealth ON: closed lid and three lashes. -->
    <g id="eye-closed" fill="none" stroke="currentColor" stroke-width="0.085">
      <path d="M0.05 0.35 Q0.5 0.95 0.95 0.35"/>
      <path d="M0.24 0.55 L0.16 0.75 M0.5 0.65 L0.5 0.85 M0.76 0.55 L0.84 0.75"/>
    </g>
    <!-- Streamer: outlined screen, antenna, stand and base. -->
    <g id="tv" fill="none" stroke="currentColor" stroke-width="0.085">
      <rect x="1.45" y="0.24" width="1" height="0.58" rx="0.08"/>
      <path d="M1.7 0.02 L1.95 0.24 M2.2 0.02 L1.95 0.24 M1.95 0.82 L1.95 0.96 M1.72 0.96 L2.18 0.96"/>
    </g>
    <!-- Streamer ON adds the filled screen. -->
    <rect id="tv-screen" x="1.58" y="0.37" width="0.74" height="0.32" rx="0.03" fill="currentColor"/>
    <!-- igDummy reservation: 2.5 x 1 font units. -->
    <rect id="reserve" x="0" y="0" width="2.5" height="1" fill="none"
          stroke="#5a5a66" stroke-width="0.02" stroke-dasharray="0.08 0.06"/>
  </defs>

  <rect width="1040" height="840" fill="#15151a"/>

  <text x="40" y="40" font-size="22" font-weight="bold" fill="#ffffff">Deluxe privacy indicators: source-geometry preview (not a screenshot)</text>
  <text x="40" y="64" font-size="13" fill="#cfd3da">Traced from privacy_icons() in src/runtime/ui.rs (2026-10-21 working tree). 1 unit = the ImGui font size, enlarged here.</text>
  <text x="40" y="82" font-size="13" fill="#cfd3da">Curves and the pupil are ideal shapes; ImGui tessellates each into 12 segments. The * glyph and all text are font-dependent placeholders.</text>

  <!-- A: the eye alone, 1 unit = 110 px. -->
  <rect x="20" y="100" width="490" height="200" rx="10" fill="#202028"/>
  <text x="40" y="124" font-size="15" font-weight="bold" fill="#ffffff">Stealth: eye in the theme text colour</text>
  <use xlink:href="#eye-open" transform="translate(80 140) scale(110)" color="#ffffff"/>
  <use xlink:href="#eye-closed" transform="translate(300 140) scale(110)" color="#ffffff"/>
  <text x="135" y="280" font-size="13" fill="#cfd3da" text-anchor="middle">Stealth OFF: open eye</text>
  <text x="355" y="280" font-size="13" fill="#cfd3da" text-anchor="middle">Stealth ON: closed lid with lashes</text>

  <!-- B: the TV alone, 1 unit = 110 px, shifted left by its 1.45-unit offset. -->
  <rect x="530" y="100" width="490" height="200" rx="10" fill="#202028"/>
  <text x="550" y="124" font-size="15" font-weight="bold" fill="#ffffff">Streamer: TV, GREY outline or GREEN screen</text>
  <use xlink:href="#tv" transform="translate(440.5 140) scale(110)" color="#b3b3b3"/>
  <g transform="translate(680.5 140) scale(110)" color="#73e673">
    <use xlink:href="#tv"/>
    <use xlink:href="#tv-screen"/>
  </g>
  <text x="655" y="280" font-size="13" fill="#cfd3da" text-anchor="middle">Streamer OFF: grey outline</text>
  <text x="895" y="280" font-size="13" fill="#cfd3da" text-anchor="middle">Streamer ON: green filled screen</text>

  <!-- C: the whole privacy_icons() block, 1 unit = 64 px. -->
  <rect x="20" y="320" width="1000" height="180" rx="10" fill="#202028"/>
  <text x="40" y="344" font-size="15" font-weight="bold" fill="#ffffff">Whole privacy_icons() block, 1 unit = 64 px (dashed: the 2.5 x 1 igDummy reservation)</text>

  <g transform="translate(50 370) scale(64)">
    <use xlink:href="#reserve"/>
    <use xlink:href="#eye-open" color="#ffffff"/>
    <use xlink:href="#tv" color="#b3b3b3"/>
  </g>
  <g transform="translate(300 370) scale(64)">
    <use xlink:href="#reserve"/>
    <use xlink:href="#eye-closed" color="#ffffff"/>
    <g color="#73e673"><use xlink:href="#tv"/><use xlink:href="#tv-screen"/></g>
  </g>
  <g transform="translate(550 370) scale(64)">
    <use xlink:href="#reserve"/>
    <use xlink:href="#eye-closed" color="#f2d940"/>
    <use xlink:href="#tv" color="#b3b3b3"/>
  </g>
  <text x="710" y="422" font-size="64" fill="#f2d940">*</text>
  <g transform="translate(800 370) scale(64)">
    <use xlink:href="#reserve"/>
    <use xlink:href="#eye-open" color="#f2d940"/>
    <g color="#73e673"><use xlink:href="#tv"/><use xlink:href="#tv-screen"/></g>
  </g>
  <text x="960" y="422" font-size="64" fill="#f2d940">*</text>

  <text x="130" y="462" font-size="13" fill="#cfd3da" text-anchor="middle">Stealth OFF, Streamer OFF</text>
  <text x="130" y="480" font-size="12" fill="#9aa0aa" text-anchor="middle">white open eye, grey TV</text>
  <text x="380" y="462" font-size="13" fill="#cfd3da" text-anchor="middle">Stealth ON, Streamer ON</text>
  <text x="380" y="480" font-size="12" fill="#9aa0aa" text-anchor="middle">white closed eye, green TV</text>
  <text x="630" y="462" font-size="13" fill="#cfd3da" text-anchor="middle">Saved Stealth ON, connection latched OFF</text>
  <text x="630" y="480" font-size="12" fill="#9aa0aa" text-anchor="middle">amber eye + *: applies after reconnect</text>
  <text x="880" y="462" font-size="13" fill="#cfd3da" text-anchor="middle">Saved Stealth OFF, latched ON</text>
  <text x="880" y="480" font-size="12" fill="#9aa0aa" text-anchor="middle">amber eye + *; TV is never amber</text>

  <!-- D: placement sketch, 1 unit = 24 px. -->
  <rect x="20" y="520" width="1000" height="230" rx="10" fill="#202028"/>
  <text x="40" y="544" font-size="15" font-weight="bold" fill="#ffffff">Placement sketch, 1 unit = 24 px; values are placeholders, not captured text</text>
  <text x="40" y="564" font-size="12" fill="#9aa0aa">Settings table, You selected, Stealth framed (0.9.0 light-blue focus)</text>
  <text x="560" y="564" font-size="12" fill="#9aa0aa">In-match strip line 1, You selected</text>

  <text x="40" y="595" font-size="24" fill="#ffffff">&gt; You</text>
  <g transform="translate(128 576) scale(24)">
    <rect x="-0.12" y="-0.12" width="1.24" height="1.24" rx="0.15" fill="none" stroke="#73c7ff" stroke-width="0.09"/>
    <use xlink:href="#eye-closed" color="#ffffff"/>
    <use xlink:href="#tv" color="#b3b3b3"/>
  </g>
  <text x="260" y="595" font-size="24" fill="#ffffff">Vanilla+ | Auto | Wi-Fi</text>
  <text x="40" y="627" font-size="24" fill="#ffffff">NetLatency</text>
  <text x="260" y="627" font-size="24" fill="#ffffff">Auto</text>
  <text x="40" y="659" font-size="24" fill="#ffffff">NetProfile</text>
  <text x="260" y="659" font-size="24" fill="#ffffff">Vanilla+</text>

  <text x="560" y="595" font-size="24" fill="#ffffff">&gt;You:</text>
  <g transform="translate(652 576) scale(24)">
    <use xlink:href="#eye-closed" color="#ffffff"/>
    <use xlink:href="#tv" color="#b3b3b3"/>
  </g>
  <text x="730" y="595" font-size="24" fill="#ffffff">Net ...  Profile ...</text>

  <text x="40" y="694" font-size="12" fill="#b3b3b3" xml:space="preserve">ZR+Left/Right edits or picks a You icon   L+R+X toggles the highlight (You icon, or Vanilla+/LLUltra on NetProfile)   L+R+Down next page</text>
  <text x="40" y="712" font-size="12" fill="#9aa0aa">Hint line (HINT_LINE in src/menu.rs, 0.9.0, while hints=true), text reduced to fit. 0.7.0–0.8.1 named ZR+X Stealth / ZR+Y Streamer.</text>
  <text x="40" y="736" font-size="14" fill="#f2d940">* Stealth changes after reconnect</text>
  <text x="290" y="736" font-size="12" fill="#9aa0aa">Footer line only while a Stealth change is pending; shown even with hints off.</text>

  <!-- Intended controls. -->
  <text x="40" y="784" font-size="13" fill="#cfd3da">Controls (0.9.0): on Settings with You selected, ZR+Left/Right moves the light-blue frame (Stealth, Streamer, OC); L+R+X toggles it.</text>
  <text x="40" y="804" font-size="13" fill="#cfd3da">A held X never repeats. L+R+X acts only on the highlight: Vanilla+/LLUltra on NetProfile, nothing elsewhere; ZR+X/Y do nothing.</text>
  <text x="40" y="824" font-size="13" fill="#cfd3da">Selection order on Settings: You, Opp (only while the peer shows), NetLatency, NetProfile, wrapping.</text>
</svg>
